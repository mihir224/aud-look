name: aud-look

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aud_look}
      POSTGRES_USER: ${POSTGRES_USER:-aud_look}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aud_look}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aud_look:aud_look@db:5432/aud_look}
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - hf-cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    depends_on:
      - api

volumes:
  postgres-data:
  hf-cache:
